# Builds ReStreet-Viewer.zip (Electron for Windows + the viewer app) on a GitHub server.
# Use: Actions tab -> "Build viewer" -> Run workflow. The result is in "Artifacts" -> viewer.
name: Build viewer
 
on:
  workflow_dispatch:
 
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
 
      - name: Build the viewer package
        shell: pwsh
        run: ./Viewer/build-viewer.ps1
 
      - uses: actions/upload-artifact@v4
        with:
          name: viewer
          path: ReStreet-Viewer.zip
 
