<!doctype html><html lang="en"><head><meta charset="utf-8"><title>ReStreet Setup</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{
  --glass: rgba(255,255,255,.05);
  --glass-strong: rgba(255,255,255,.09);
  --edge: rgba(255,255,255,.18);
  --ink: #fff; --muted: rgba(255,255,255,.66);
  --accent: #ffcf2e; --accent-2: #ff7a2e; --bad: #ff8a8a;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{font-family:Inter,"Segoe UI",system-ui,sans-serif;color:var(--ink);background:#0b0c12;overflow:auto}
.bg{position:fixed;inset:0;background:url(bg.jpg) center/cover;opacity:.18;filter:blur(2px) saturate(1.1)}
.glow{position:fixed;inset:0;background:radial-gradient(60% 50% at 15% 10%,rgba(255,122,46,.22),transparent 70%),radial-gradient(50% 50% at 90% 90%,rgba(255,207,46,.14),transparent 70%)}
main{position:relative;max-width:760px;margin:0 auto;padding:36px 28px 40px}
.brand{font:800 34px/1 Inter,system-ui,sans-serif;letter-spacing:-.5px}
.brand b{color:var(--accent)}
.tag{display:inline-block;margin-top:10px;padding:4px 10px;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent-2));color:#1a1206;font:800 11px Inter,sans-serif;letter-spacing:1.4px}
.lead{margin:16px 0 22px;color:var(--muted);line-height:1.5;font-size:14px}
.card{background:var(--glass);border:1px solid var(--edge);border-radius:18px;padding:22px;backdrop-filter:blur(18px)}
label{display:block;font:700 11px Inter,sans-serif;letter-spacing:1.4px;color:var(--muted);text-transform:uppercase;margin:16px 0 7px}
label:first-child{margin-top:0}
.row{display:flex;gap:10px}
input,select{flex:1;min-width:0;height:42px;padding:0 14px;border-radius:12px;border:1px solid var(--edge);background:rgba(0,0,0,.35);color:var(--ink);font:500 14px Inter,sans-serif;outline:none}
input:focus,select:focus{border-color:var(--accent)}
button{height:42px;padding:0 18px;border-radius:12px;border:1px solid var(--edge);background:var(--glass-strong);color:var(--ink);font:600 14px Inter,sans-serif;cursor:pointer}
button:hover{background:rgba(255,255,255,.14)}
button:disabled{opacity:.45;cursor:default}
.hint{margin-top:6px;font-size:12px;color:var(--muted)}
.go{display:block;width:100%;height:54px;margin-top:22px;border:0;background:linear-gradient(90deg,var(--accent),var(--accent-2));color:#1a1206;font:800 17px Inter,sans-serif;letter-spacing:1.5px;text-transform:uppercase}
.go:hover{filter:brightness(1.06);background:linear-gradient(90deg,var(--accent),var(--accent-2))}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:18px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-2));transition:width .4s}
.stage{margin-top:10px;font-size:14px}
.log{margin-top:10px;font:12px/1.6 ui-monospace,monospace;color:var(--muted);white-space:pre-wrap;max-height:120px;overflow:auto}
.err{margin-top:14px;padding:12px 14px;border-radius:12px;background:rgba(255,80,80,.12);border:1px solid rgba(255,120,120,.35);color:var(--bad);font-size:13px;line-height:1.45}
.proton{margin-top:16px;font-size:12px;color:var(--muted)}
.proton.bad{color:var(--bad)}
.hidden{display:none}
@media (max-width:560px){main{padding:24px 16px}.row{flex-wrap:wrap}.row button{width:100%}}
</style></head><body>
<div class="bg"></div><div class="glow"></div>
<main>
  <div class="brand">Re<b>Street</b></div>
  <span class="tag" id="ver">LINUX SETUP</span>
  <p class="lead">Installs FIFA Street (2012) from your own Xbox 360 ISO. The game runs through Proton; nothing else needs to be installed. It takes 5 to 15 minutes and about 12 GB.</p>
  <div class="card">
    <div id="form">
      <label for="iso">Your FIFA Street ISO</label>
      <div class="row"><input id="iso" placeholder="Choose your FIFA Street (Xbox 360) ISO" spellcheck="false"><button data-cmd="pickIso">Browse</button></div>
      <label for="target">Install to</label>
      <div class="row"><input id="target" spellcheck="false"><button data-cmd="pickTarget">Browse</button></div>
      <p class="hint">A new or empty folder.</p>
      <label for="name">Online name</label>
      <div class="row"><input id="name" maxlength="15" placeholder="3 to 15 letters or numbers" spellcheck="false"></div>
      <p class="hint">Friends see this name.</p>
      <label for="region">Server</label>
      <div class="row"><select id="region"></select></div>
    </div>
    <div id="progress" class="hidden">
      <div class="stage" id="stage"></div>
      <div class="bar"><i id="bar"></i></div>
      <div class="log" id="log"></div>
    </div>
    <div class="err hidden" id="err"></div>
    <button class="go" id="go">Install ReStreet</button>
    <p class="proton" id="proton"></p>
  </div>
</main>
<script>
// Same link to the launcher process as launcher.html in a browser: POST msg, long-poll events (PageServer.cs).
const base = location.pathname.replace(/[^/]*$/, '');
const send = m => fetch(base + 'msg', {method: 'POST', body: JSON.stringify(m)}).catch(() => {});
const $ = id => document.getElementById(id);
let state = {}, editing = null;
(async function poll() {
  for (;;) {
    try { const r = await fetch(base + 'events', {cache: 'no-store'}); for (const d of await r.json()) render(d); }
    catch (e) { await new Promise(r => setTimeout(r, 2000)); }
  }
})();
['iso', 'target', 'name'].forEach(id => {
  $(id).addEventListener('focus', () => editing = id);
  $(id).addEventListener('blur', () => { editing = null; send({cmd: 'set', [id]: $(id).value}); });
  $(id).addEventListener('keydown', e => { if (e.key === 'Enter') $(id).blur(); });
});
$('region').onchange = () => send({cmd: 'set', region: +$('region').value});
document.querySelectorAll('[data-cmd]').forEach(b => b.onclick = () => send({cmd: b.dataset.cmd}));
$('go').onclick = async () => {
  if (state.done) return send({cmd: 'play'});
  await send({cmd: 'set', iso: $('iso').value, target: $('target').value, name: $('name').value, region: +$('region').value});
  send({cmd: 'install'});
};
function render(s) {
  if (s.type !== 'setup') return;
  state = s;
  for (const id of ['iso', 'target', 'name']) if (editing !== id) $(id).value = s[id] || '';
  if ($('region').options.length !== s.regions.length) $('region').innerHTML = s.regions.map((r, i) => `<option value="${i}">${r}</option>`).join('');
  $('region').value = s.region;
  $('ver').textContent = 'LINUX SETUP · ' + s.version;
  const working = s.busy || s.done;
  $('form').classList.toggle('hidden', working);
  $('progress').classList.toggle('hidden', !working);
  $('stage').textContent = s.stage;
  $('bar').style.width = Math.max(0, s.percent) + '%';
  $('log').textContent = s.log.join('\n');
  $('err').classList.toggle('hidden', !s.error);
  $('err').textContent = s.error;
  $('go').disabled = s.busy || !s.protonOk;
  $('go').textContent = s.done ? 'Play' : s.busy ? 'Installing…' : 'Install ReStreet';
  $('proton').textContent = (s.protonOk ? 'Runs with ' : '') + s.proton;
  $('proton').classList.toggle('bad', !s.protonOk);
}
send({cmd: 'state'});
</script>
</body></html>
